<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thursday Sign In</title>
  <meta name="description" content="Do you need a Bustan sign in for Thursday?">
  <meta property="og:title" content="Thursday Sign In">
  <meta property="og:description" content="Do you need a Bustan sign in for Thursday?">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f3f5f4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="page">
    <div class="card" id="card">
      <div class="ask">
        <div class="badge"><span class="dot"></span>Thursday sign in</div>
        <h1>Do you need a Bustan sign in for Thursday?</h1>
        <p class="sub">Let us know so we can get yours ready.</p>
        <div class="buttons">
          <button id="yes" type="button" class="btn primary">Yes</button>
          <button id="no" type="button" class="btn">No</button>
        </div>
        <p class="hint">🔔 Turn on sound for confirmation alerts</p>
      </div>

      <div class="progress-view" aria-live="polite">
        <p id="statusTitle" class="status-title"></p>
        <div class="bar"><div id="barFill" class="bar-fill"></div></div>
        <ul id="steps" class="steps"></ul>
        <p id="fine" class="fine"></p>
        <div id="codeBox" class="code-box"><span id="code"></span></div>
      </div>
    </div>
  </main>

  <div id="scare" class="scare" aria-hidden="true">
    <div class="jolt">
      <img class="photo" src="scare.jpg?v=6" alt="" decoding="async">
      <img class="photo neg" src="scare-neg.jpg?v=1" alt="" decoding="async">
    </div>
    <div class="flash white"></div>
    <div class="flash red"></div>
  </div>

  <section id="reveal" class="reveal" hidden>
    <div class="reveal-inner">
      <p class="big" aria-label="laughing">😂</p>
      <div class="maker">
        <p class="maker-title">prank someone else</p>
        <button id="share" type="button">Send the link</button>
        <p id="shareMsg" class="share-msg"></p>
      </div>
      <button id="again" type="button" class="again">watch it again</button>
      <p class="watermark">Made by SK</p>
    </div>
  </section>

  <script src="script.js?v=8"></script>
</body>
</html>
